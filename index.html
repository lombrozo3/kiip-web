<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; img-src https: http: blob:; connect-src https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Kiip</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="data.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="bar">
  <svg class="logo" viewBox="0 0 140 84" role="img" aria-label="Kiip">
    <path class="logo-word" d="M12 13V59M40 13 12 41M23 30 42 59M59 29V59M79 29V59M98 29V75M98 44a15 15 0 1 0 30 0a15 15 0 1 0-30 0"></path>
    <path class="logo-wave" d="M49 14q5-9 10 0t10 0t10 0t10 0"></path>
  </svg>
  <div class="bar-tools" id="tools" hidden>
    <input id="search" type="search" placeholder="Search" aria-label="Search your library">
    <button id="add" type="button">Add</button>
    <span id="save-status" class="save-status" role="status"></span>
    <button id="save-action" class="quiet" type="button" hidden></button>
    <label class="sort-label">Sort
      <select id="sort">
        <option value="newest-saved">Newest saved</option>
        <option value="oldest-saved">Oldest saved</option>
        <option value="newest-published">Newest published</option>
        <option value="oldest-published">Oldest published</option>
      </select>
    </label>
    <button id="refresh" class="quiet" type="button">Refresh</button>
    <button id="sign-out" class="quiet" type="button">Sign out</button>
  </div>
</header>

<section id="welcome" class="welcome">
  <h1>Your Kiip library</h1>
  <p id="message">Sign in with the Google account you use for sync on your phone. Your library is read straight from your own Drive, and only into this browser.</p>
  <button id="sign-in" type="button">Sign in with Google</button>
</section>

<main id="library" class="library" hidden>
  <nav class="side" aria-label="Filters">
    <div id="views" class="group"></div>
    <details id="sites-box" class="group" open>
      <summary>Sites</summary>
      <div id="sites"></div>
    </details>
    <details id="tags-box" class="group" open>
      <summary>Tags</summary>
      <div id="tags"></div>
    </details>
  </nav>
  <div class="content">
    <p id="result" class="result" role="status"></p>
    <div id="grid" class="grid"></div>
    <div id="more" class="more"></div>
  </div>
</main>

<dialog id="sheet" class="sheet" aria-label="Saved item"></dialog>

<div id="toast" class="toast" role="status" hidden>
  <span id="toast-text"></span>
  <button id="toast-action" class="quiet" type="button" hidden>Undo</button>
</div>
<datalist id="all-tags"></datalist>
</body>
</html>
